name: Security & Vulnerability Analysis

on:
  pull_request:
    branches:
      - main
      - dev
      - synch_sonarqube

jobs:
  static-security-scan:
    name: Python Static Security Analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
        # Runs security check on 'src' directory, ignores test directories, and exits with non-zero if issues found
        run: bandit -r src/ -ll -ii

  dependency-scan:
    name: Dependency & Secret Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1' # Fail the build if vulnerabilities of specified severity are found
          severity: 'HIGH,CRITICAL'

  sonarcloud-scan:
    name: SonarCloud Code Quality Gate Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Disable shallow clone for accurate analysis history

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
